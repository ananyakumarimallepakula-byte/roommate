# ========================================================
# ROOMMATE Platform - Application Properties
# ========================================================

spring.application.name=roommate-backend

# Server Port (Render passes PORT environment variable)
server.port=${PORT:8080}

# Database Configuration
# Supports standard cloud variables: SPRING_DATASOURCE_URL, DB_URL, or falls back to local persistent store
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/roommatedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations (Disabled for embedded local store, enabled when cloud MySQL is configured)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${UPLOAD_DIR:uploads}

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://roommate-pi.vercel.app}

# Actuator Health & Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Data Initialization (disable after first prod deploy: DATA_INIT_ENABLED=false)
app.data-init.enabled=${DATA_INIT_ENABLED:true}

# Logging
logging.level.com.roommate=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
