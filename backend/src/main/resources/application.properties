# ========================================================
# ROOMMATE Platform - Application Properties
# ========================================================

spring.application.name=roommate-backend
server.port=${SERVER_PORT:8080}

# Database Configuration (Default: Persistent File H2 with MySQL Compatibility Mode)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/roommatedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations (Disabled for embedded local file, enabled for MySQL profile)
spring.flyway.enabled=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=${UPLOAD_DIR:uploads}

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.roommate=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
