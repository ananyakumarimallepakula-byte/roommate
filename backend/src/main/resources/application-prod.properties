# ========================================================
# ROOMMATE Platform - Production Profile Configuration
# ========================================================
# Activated on Render via SPRING_PROFILES_ACTIVE=prod
#
# DATABASE: Set SPRING_DATASOURCE_URL as a COMPLETE JDBC URL
# in Render Environment Variables. Example:
# jdbc:mysql://hostname:3306/roommate_db?useSSL=true&serverTimezone=UTC

# MySQL Datasource — reads the full JDBC URL directly from env var
# NO ${DB_HOST} composition — prevents UnknownHostException
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Flyway — run migrations in production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging — concise for production
logging.level.root=WARN
logging.level.com.roommate=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator — expose only health in production, hide details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
