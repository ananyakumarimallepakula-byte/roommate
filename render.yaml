services:
  - type: web
    name: roommate-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # Server
      - key: PORT
        value: 8080
      # Security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # CORS — your Vercel frontend URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://roommate-pi.vercel.app
      # File uploads
      - key: UPLOAD_DIR
        value: /app/uploads
      # Data seeding
      - key: DATA_INIT_ENABLED
        value: true
