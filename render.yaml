services:
  - type: web
    name: roommate-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # Spring Boot active profile
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Server
      - key: PORT
        value: 8080
      # Database — provide the FULL JDBC URL (no DB_HOST composition)
      # Example: jdbc:mysql://your-host.aiven.io:3306/roommate_db?useSSL=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # CORS — your Vercel frontend URL
      - key: CORS_ALLOWED_ORIGINS
        value: https://roommate-pi.vercel.app
      # File uploads
      - key: UPLOAD_DIR
        value: /app/uploads
      # Data seeding — disable after first deploy
      - key: DATA_INIT_ENABLED
        value: true
